name: CMake Build and Test

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release, Debug]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install BLAS (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

    - name: Install OpenBLAS (Windows)
      if: runner.os == 'Windows'
      run: vcpkg install openblas:x64-windows

    - name: Configure CMake
      run: >
        cmake -B build -S .
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_VERBOSE_MAKEFILE=ON
        ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}
      
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}
      
    - name: Run tests
      run: cd build && ctest -C ${{ matrix.build_type }} --verbose

    # The library must also configure, build and test on its own, with no engine
    # around it: that is what lets it move to its own repository.
    - name: Configure sparsediff_linalg standalone
      run: >
        cmake -B build-standalone -S sparsediff_linalg
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}

    - name: Build sparsediff_linalg standalone
      run: cmake --build build-standalone --config ${{ matrix.build_type }}

    - name: Test sparsediff_linalg standalone
      run: ctest --test-dir build-standalone -C ${{ matrix.build_type }} --output-on-failure
