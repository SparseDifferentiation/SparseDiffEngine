name: conda-forge BLAS

# Builds against conda-forge's BLAS packages, which ship no vendor CMake config
# (Windows) and split CBLAS into libcblas (Linux), as the sparsediffpy
# conda-forge recipe does.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v5

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: build
          conda-remove-defaults: "true"

      - name: Install conda-forge packages (Linux)
        if: runner.os == 'Linux'
        run: >
          conda install -y cmake ninja c-compiler blas-devel
          "libblas=*=*netlib" "libcblas=*=*netlib"

      - name: Install conda-forge packages (Windows)
        if: runner.os == 'Windows'
        run: conda install -y cmake openblas libopenblas

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
          -DCMAKE_C_FLAGS="-isystem $CONDA_PREFIX/include"
          -DBLA_VENDOR=Generic

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -S .
          -DCMAKE_PREFIX_PATH="$CONDA_PREFIX/Library"

      - name: Show BLAS selection
        run: grep -E '^(BLAS_|CBLAS_LIBRARY|OPENBLAS_|OpenBLAS_DIR)' build/CMakeCache.txt || true

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: cd build && ctest -C Release --output-on-failure

      # Like conda-forge's pinning, build against netlib so the binary records
      # the switchable libblas.so.3/libcblas.so.3 SONAMEs (the openblas variant
      # is a symlink to libopenblas.so.0).
      - name: Check libcblas is linked explicitly (Linux)
        if: runner.os == 'Linux'
        run: |
          readelf -d build/all_tests | grep NEEDED
          readelf -d build/all_tests | grep -q 'libcblas\.so\.3'

      - name: Re-run tests after switching to OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          conda install -y "libblas=*=*openblas" "libcblas=*=*openblas"
          cd build && ctest -C Release --output-on-failure
